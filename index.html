<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfbf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="道場">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>リーディング道場</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap">
<style>
/* Layout: 紙の答案用紙。枠で囲まず余白と細い罫線で区切る。丸は赤ペン、選択はマークシートの楕円、達成は出席カードのはんこ。 */
:root{
  --paper:#fbfbf8; --ink:#1c1e24; --sub:#6a6f7b; --rule:#d9d9d2; --pen:#1d4f9f; --red:#c8321f; --pencil:#3a3d45; --box:#ffffff;
  --k-n:#1d4f9f; --k-v:#19703f; --k-a:#b25a00; --k-d:#7a3fa0;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-head:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#16181d; --ink:#e9e7e1; --sub:#9b9fa9; --rule:#33363e; --pen:#8fb2f0; --red:#ff7461; --pencil:#c9ccd4; --box:#1d2026; --k-n:#8fb2f0; --k-v:#6fcf97; --k-a:#f0a95a; --k-d:#c9a0e8; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#16181d; --ink:#e9e7e1; --sub:#9b9fa9; --rule:#33363e; --pen:#8fb2f0; --red:#ff7461; --pencil:#c9ccd4; --box:#1d2026; --k-n:#8fb2f0; --k-v:#6fcf97; --k-a:#f0a95a; --k-d:#c9a0e8; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
#app{max-width:520px;margin:0 auto;padding-block:22px 100px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:30px}
#app.insess{padding-block:14px 36px;gap:18px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--f-head);font-size:24px;font-weight:700;letter-spacing:.04em}
h2{font-family:var(--f-head);font-size:19px;font-weight:700;letter-spacing:.02em}
.lab{font-size:12px;color:var(--sub);letter-spacing:.08em}
.sub{color:var(--sub);font-size:13px}
.red{color:var(--red)}
.num{font-family:var(--f-head);font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec.line{border-top:1px solid var(--rule);padding-top:22px}
.row{display:flex;gap:12px;align-items:center}
.row>.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pen);outline-offset:3px}
.btn{border:1px solid var(--ink);background:transparent;border-radius:4px;padding:8px 16px;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--pen);border-color:var(--pen);color:var(--paper);font-weight:700;padding:14px 18px;font-size:16px;letter-spacing:.2em;width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{border:0;background:none;padding:6px 0;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
/* header */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.rank{font-family:var(--f-head);font-size:15px;text-align:right;line-height:1.3}
.figs{display:flex;gap:28px}
.figs b{display:block;font-family:var(--f-head);font-size:30px;line-height:1.15;font-weight:700}
.figs b small{font-size:14px;font-weight:500}
/* はんこ */
.hanko{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:2.5px solid var(--red);border-radius:50%;color:var(--red);font-family:var(--f-head);font-weight:800;font-size:19px;line-height:1;transform:rotate(-8deg);opacity:.92}
.hanko.big{width:76px;height:76px;font-size:36px;border-width:4px}
.hanko.sm{width:24px;height:24px;font-size:11px;border-width:1.5px}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slots i{width:46px;height:46px;border:1px dashed var(--rule);display:flex;align-items:center;justify-content:center;font-style:normal}
.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1.9) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:.92}}
/* 出席カード */
.card7{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.card7>div{aspect-ratio:1;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
.card7>div.hd{aspect-ratio:auto;padding:2px 0;font-size:11px;color:var(--sub)}
.card7 em{position:absolute;top:2px;left:4px;font-style:normal;font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.card7 .today em{color:var(--pen);font-weight:700}
.card7 .part{font-size:11px;color:var(--sub)}
/* bars */
.bar{height:3px;background:var(--rule)}
.bar>i{display:block;height:100%;background:var(--ink)}
/* units */
.unit{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--rule)}
.tips{margin:0;padding:0 0 0 18px;font-size:14px}
.tips li{margin:3px 0}
/* session */
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border:1px solid var(--sub)}
.dots i.ok{background:var(--ink);border-color:var(--ink)} .dots i.ng{background:var(--red);border-color:var(--red)} .dots i.cur{border-color:var(--pen);border-width:2px}
.timer{height:2px;background:var(--rule);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--pen);transform-origin:left;animation:drain linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
.doc{background:var(--box);border:1px solid var(--rule);padding:16px 16px;font-family:var(--f-en);font-size:16px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.doc .dh{display:block;font-family:var(--f-body);font-size:11px;color:var(--sub);letter-spacing:.1em;margin-bottom:8px}
.stem{font-family:var(--f-en);font-size:19px;line-height:1.6}
.stem.jp{font-family:var(--f-body);font-size:15px;color:var(--sub)}
.stem .w{display:block;font-size:34px;font-weight:600;line-height:1.3}
.stem .ex{display:block;font-size:16px;color:var(--sub);margin-top:4px}
.blank{letter-spacing:.05em;white-space:nowrap}
.blank.cur{border-bottom:2px solid var(--pen);color:var(--pen)}
.filled{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.opts{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.opt{display:flex;gap:14px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:13px 2px;font-family:var(--f-en);font-size:16px;line-height:1.45;color:var(--ink)}
.opt:disabled{color:var(--ink);cursor:default}
.opt .ja{font-family:var(--f-body)}
.mark{flex:none;position:relative;width:34px;height:22px;border:1.5px solid var(--pencil);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--sub)}
.opt.picked .mark{background:var(--pencil);color:var(--paper)}
.opt.right .mark::after{content:"";position:absolute;inset:-8px -7px;border:2.5px solid var(--red);border-radius:52% 48% 50% 50%/46% 54% 46% 54%;transform:rotate(-7deg)}
.opt.wrong::after{content:"✕";margin-left:auto;color:var(--red);font-weight:700;font-family:var(--f-body)}
.opt>span:last-child{min-width:0}
.sfx{font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.pl{display:block;font-family:var(--f-body);font-size:12px;line-height:1.5;margin-top:2px}
.pl b{font-weight:700;margin-right:8px}
.k-n{color:var(--k-n)} .k-v{color:var(--k-v)} .k-a{color:var(--k-a)} .k-d{color:var(--k-d)} .k-o{color:var(--sub)}
.tw{font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.cex{font-family:var(--f-en);font-size:19px;line-height:1.6}
.leg{display:flex;gap:12px;font-size:12px;font-weight:700}
.hk,.fam{border-top:1px solid var(--rule);padding-top:10px;margin-top:6px}
.hk .lab,.fam .lab{display:block;margin-bottom:2px}
.fam ul{list-style:none;margin:0;padding:0}
.fam li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:3px 0}
.fam .en{font-family:var(--f-en);font-size:17px;font-weight:600}
.fam small{font-size:11px;color:var(--sub)}
.fb{display:flex;flex-direction:column;gap:4px}
.fb .res{font-family:var(--f-head);font-size:20px;font-weight:700;color:var(--red)}
.fb .res small{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--sub);margin-left:8px}
.fb .en{font-family:var(--f-en);font-size:16px}
.score{font-family:var(--f-head);font-size:52px;font-weight:700;line-height:1.1}
.score small{font-size:22px;font-weight:500}
@media (prefers-reduced-motion: reduce){.pop{animation:none}.timer i{animation:none;transform:scaleX(.5)}}
/* forms */
label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
input,select{font:inherit;color:var(--ink);background:var(--box);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:none;border-radius:4px;padding:6px 12px;font-size:14px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.why{margin:0;padding:0;list-style:none;font-size:14px}
.why li{padding:8px 0;border-top:1px solid var(--rule)}
.why small{color:var(--sub);display:block}
/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));z-index:5}
#tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabs button{border:0;background:none;padding:13px 4px 12px;font-size:13px;color:var(--sub);letter-spacing:.06em}
#tabs button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 2px 0 var(--ink)}
</style>

</head>
<body>
<div id="app"></div>
<nav id="tabs" aria-label="メニュー"><div>
  <button id="tab-home" data-act="tab" data-v="home">ホーム</button>
  <button id="tab-units" data-act="tab" data-v="units">ユニット</button>
  <button id="tab-record" data-act="tab" data-v="record">記録</button>
  <button id="tab-setup" data-act="tab" data-v="setup">設定</button>
</div></nav>

<script>
/* ===================== 教材データ（すべてオリジナル問題。選択肢は先頭が正解、表示時にシャッフル） ===================== */
const UNITS=[
 {id:'pos',part:5,name:'品詞',per:20,tips:[
  '空所の前後だけを見て、文の意味は読まずに解く。',
  '冠詞・形容詞のあと、前置詞の前は名詞。',
  '名詞の前は形容詞。動詞・形容詞・文全体を飾るのは副詞。',
  '助動詞（will, can など）のあとは動詞の原形。',
  '語尾で見分ける：-tion / -ment / -ness は名詞、-ive / -al / -ful / -able は形容詞、-ly は副詞、-ize / -ify は動詞。']},
 {id:'verb',part:5,name:'動詞の形',per:20,tips:[
  '確認する順番は「主語の単数・複数」「目的語があるか（能動か受動か）」「時を表す語句」。',
  'yesterday, last week は過去形。since, for + 期間 は現在完了。next, tomorrow は未来。',
  '空所のあとに目的語がなければ受動態（be + 過去分詞）を疑う。',
  'suggest, consider, enjoy のあとは -ing。look forward to のあとも -ing。',
  'be required / be asked / be expected のあとは to + 原形。']},
 {id:'pron',part:5,name:'代名詞',per:20,tips:[
  '名詞の前は所有格（its, her）。前置詞や動詞のあとは目的格（him, her）。',
  '名詞が続かず「〜のもの」なら所有代名詞（hers, mine）。',
  'by oneself は「ひとりで」。主語と同じ人を指すときは -self。',
  'those who 〜 は「〜する人々」。',
  'some 〜, others 〜 は「〜する人もいれば、〜する人もいる」。']},
 {id:'prep',part:5,name:'前置詞・接続詞',per:20,tips:[
  'うしろが名詞のかたまりなら前置詞、主語＋動詞なら接続詞。',
  '前置詞：despite, during, due to, because of。接続詞：although, while, because。',
  'by は「〜までに（期限）」、until は「〜までずっと（継続）」。',
  'within + 期間 は「〜以内に」。',
  'unless は「〜しない限り」。if の反対として考える。']},
 {id:'rel',part:5,name:'関係詞・比較',per:20,tips:[
  '先行詞が人か物か、うしろの文で何が欠けているかを見る。',
  '主語が欠けていれば who / which / that。名詞が続けば whose。',
  '場所が先行詞で、うしろが完全な文なら where。',
  'what は先行詞なしで「〜すること・もの」。',
  'than があれば比較級。the と of all / in があれば最上級。as 〜 as の間は原級。']},
 {id:'vocab',part:5,name:'語彙',per:20,tips:[
  '単語は「いっしょに使う語」とセットで覚える（comply with, refer to, out of stock）。',
  '空所の直後の前置詞がヒントになることが多い。',
  'つづりが似た語（expand / expend / expose）は引っかけ。意味で区別する。',
  '金フレのフレーズごと音読すると、この単元の正答率が上がる。']},
 {id:'p6',part:6,name:'長文穴埋め',per:30,tips:[
  '品詞・動詞の形の問題は、空所のある文だけで解く。',
  'つなぎ言葉（However, Therefore）と文を入れる問題は、前後の文を読む。',
  '文を入れる問題は、代名詞（this, it）や話題のつながりを手がかりにする。',
  '1文書2分が目安。迷ったら印をつけて次へ進む。']},
 {id:'p7s',part:7,name:'読解（1つの文書）',per:60,tips:[
  '先に設問を読み、何を探すかを決めてから本文を読む。',
  '正解は本文の言い換えになっている（free → at no cost など）。',
  'NOT問題は、本文にある選択肢を3つ消していく。',
  '1問1分が目安。根拠の文を見つけたら、それ以上読まない。']},
 {id:'p7d',part:7,name:'読解（2つの文書）',per:60,tips:[
  '設問のキーワード（名前・日付）で、どちらの文書に答えがあるかを決める。',
  '1セットに1〜2問は、2つの文書を合わせないと解けない。',
  '日付・金額・条件（割引、期限）には読みながら印をつける。',
  '時間が足りないときは、1つの文書だけで解ける設問から先に答える。']},
 {id:'word',part:0,name:'単語',per:8,tips:[
  'TOEICによく出る語を、出やすい順に並べています。',
  '例文ごと声に出して読むと、Part 5 の語彙問題にも効きます。',
  '正解した語は1日後、3日後、7日後と間をあけて出ます。まちがえた語はすぐ戻ります。',
  '1日3セット（30語）まで。新しい語は1セットに最大10語です。',
  '答えたあと、例文が品詞ごとに色分けされ、なりたちと仲間の語が出ます。']}
];
/* 単語の選定と並び順は TOEIC Service List 1.2（Browne, C. & Culligan, B., 2016, CC BY-SA 4.0）の頻度順位に基づく。
   日本語訳と例文は独自に作成。この単語データは CC BY-SA 4.0 で利用できる。途中に挿入せず、末尾に追加すること。 */
const WORDS=[
[`vacation`,'n',`休暇`,`She is on vacation until Friday.`,`彼女は金曜日まで休暇中です。`],
[`client`,'n',`顧客・依頼人`,`We met a new client this morning.`,`今朝、新しい顧客に会いました。`],
[`reservation`,'n',`予約`,`I made a reservation for two at seven.`,`7時に2名で予約しました。`],
[`sincerely`,'d',`心から・敬具`,`We sincerely apologize for the delay.`,`遅れを心からおわびします。`],
[`supervisor`,'n',`上司・監督者`,`Ask your supervisor before leaving early.`,`早退する前に上司に確認してください。`],
[`refund`,'n',`返金`,`You can get a full refund within 30 days.`,`30日以内なら全額返金を受けられます。`],
[`goods`,'n',`商品・品物`,`The goods were damaged during shipping.`,`商品は配送中に破損しました。`],
[`workshop`,'n',`研修会・講習会`,`The workshop starts at 10 A.M.`,`研修会は午前10時に始まります。`],
[`downtown`,'d',`中心街に・繁華街で`,`Our office is located downtown.`,`私たちの事務所は中心街にあります。`],
[`deadline`,'n',`締め切り`,`The deadline for applications is May 1.`,`応募の締め切りは5月1日です。`],
[`invoice`,'n',`請求書`,`Please pay the invoice by the end of the month.`,`月末までに請求書のお支払いをお願いします。`],
[`brochure`,'n',`パンフレット`,`The brochure lists all of our services.`,`パンフレットに当社の全サービスが載っています。`],
[`accountant`,'n',`会計士`,`An accountant checked the figures.`,`会計士が数字を確認しました。`],
[`clerk`,'n',`店員・事務員`,`The clerk helped me find the right size.`,`店員が合うサイズを探すのを手伝ってくれました。`],
[`publish`,'v',`出版する・公表する`,`The report will be published next week.`,`報告書は来週公表されます。`],
[`résumé`,'n',`履歴書`,`Send your résumé to the hiring manager.`,`採用担当者に履歴書を送ってください。`],
[`enclose`,'v',`同封する`,`I have enclosed a copy of the receipt.`,`領収書の写しを同封しました。`],
[`applicant`,'n',`応募者`,`Each applicant will be interviewed twice.`,`応募者はそれぞれ2回面接を受けます。`],
[`seminar`,'n',`セミナー・講習`,`He attended a seminar on marketing.`,`彼はマーケティングのセミナーに出席しました。`],
[`technician`,'n',`技術者`,`A technician will repair the printer today.`,`技術者が今日プリンターを修理します。`],
[`fare`,'n',`運賃`,`The bus fare will rise next month.`,`バスの運賃は来月上がります。`],
[`receipt`,'n',`領収書・レシート`,`Keep your receipt in case you return the item.`,`返品に備えてレシートを保管してください。`],
[`luggage`,'n',`手荷物`,`You may bring one piece of luggage on board.`,`機内には手荷物を1つ持ち込めます。`],
[`shipment`,'n',`発送・積み荷`,`The shipment arrived two days late.`,`積み荷は2日遅れて届きました。`],
[`rental`,'n',`賃貸・レンタル`,`The rental fee includes insurance.`,`レンタル料には保険が含まれます。`],

  if(x[1])h+=`<div class="fam"><span class="lab">仲間の語</span><ul>${x[1].split('|').map(e=>{const [w,k,j]=e.split(':');return `<li><span class="en k-${k==='p'?'o':k}">${esc(w)}</span><small>${PN[k]||''}</small><span>${esc(j)}</span></li>`}).join('')}</ul></div>`;
  return h}
const TITLES=['見習い','門下生','初段','二段','三段','四段','師範代','師範'];
const TRIGGERS=['朝食を食べ終えたら','8:20の英単語の前に','昼食を食べ終えたら','夕食を食べ終えたら','ゲームを始める前に','布団に入る前に'];
const IV=[0,1,3,7,14,30];
const DAY=864e5, KEY='reading-dojo-v1', WSETS=3;
const uname=u=>u.part?('Part '+u.part+' '+u.name):u.name;

/* ===================== 状態 ===================== */
function today(){const n=new Date();return Math.floor((n.getTime()-n.getTimezoneOffset()*6e4-4*36e5)/DAY)}
function fresh(){return{v:1,updatedAt:0,xp:0,streak:0,best:0,freezes:0,lastDone:null,
  day:{key:today(),done:0,correct:0,total:0,kin:false,w:0},quota:5,nextQuota:null,trigger:'',setup:false,
  testDate:'2026-11-15',kinOn:false,kin:{pos:1,pace:50},cards:{},hist:{},lastUnit:''}}
function fix(s){const f=fresh();s=Object.assign(f,s||{});s.kin=Object.assign({pos:1,pace:50},s.kin);s.day=Object.assign({key:today(),done:0,correct:0,total:0,kin:false,w:0},s.day);return s}
let S=fresh(), view='home', sess=null, done=null, openTips={}, resetArm=false, syncState='この端末に保存';
function loadLocal(){try{const t=localStorage.getItem(KEY);if(t)S=fix(JSON.parse(t))}catch(e){}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let cloud=null,busy=false,dirty=false;
function save(){S.updatedAt=Date.now();saveLocal();push()}
async function push(){if(!cloud)return;if(busy){dirty=true;return}busy=true;
  try{await cloud.set({json:JSON.stringify(S),updatedAt:S.updatedAt});syncState='アカウントに保存（ほかの端末でも続きから）'}catch(e){syncState='この端末に保存（アカウントへの保存は失敗）'}
  busy=false;if(dirty){dirty=false;push()}}
async function initCloud(){try{
  if(!(window.claude&&window.claude.use))return;
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user)return;const id=await user.id();if(!id)return;
  const ref=db.collection('data/users/'+id).doc('reading');
  const snap=await ref.get();cloud=ref;
  let remote=null;if(snap.exists){const d=snap.data();if(d&&typeof d.json==='string')remote=JSON.parse(d.json)}
  if(remote&&(remote.updatedAt||0)>(S.updatedAt||0)){if(!sess){S=fix(remote);rollover();saveLocal()}}
  else if(S.updatedAt)push();
  syncState='アカウントに保存（ほかの端末でも続きから）';if(!sess)render();
 }catch(e){}}

function rollover(){const t=today();if(S.day.key===t)return;
  if(S.day.kin){S.kin.pos+=S.kin.pace;if(S.kin.pos>1000)S.kin.pos=1}
  if(S.lastDone!=null&&S.lastDone<t-1){const gap=t-1-S.lastDone;
    if(gap<=S.freezes){S.freezes-=gap;S.lastDone=t-1}else S.streak=0}
  if(S.nextQuota){S.quota=S.nextQuota;S.nextQuota=null}
  S.day={key:t,done:0,correct:0,total:0,kin:false,w:0}}
function level(){let xp=S.xp,lv=1,need=150;while(xp>=need){xp-=need;lv++;need=100+lv*50}return{lv,cur:xp,need,title:TITLES[Math.min(lv-1,TITLES.length-1)]}}
function locked(){return S.day.done>=S.quota}
function daysToTest(){const p=(S.testDate||'').split('-').map(Number);if(p.length!==3||!p[0])return null;return Math.round(Date.UTC(p[0],p[1]-1,p[2])/DAY)-today()}
function ustat(u){const ids=BYUNIT[u],t=today();let m=0,due=0,seen=0;ids.forEach(id=>{const c=S.cards[id];if(c){seen++;if(c.b>=2)m++;if(c.d<=t)due++}});return{total:ids.length,m,due,seen,unseen:ids.length-seen}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function recommend(){const pat=['g','p7s','g','p6','p7d','g','p7s','g'];let k=pat[S.day.done%pat.length];
  if(k!=='g')return k;
  let best=null,bs=-1;UNITS.filter(u=>u.part===5).forEach(u=>{const s=ustat(u.id);let sc=s.due*2+s.unseen+(s.total-s.m)*0.1;if(u.id===S.lastUnit)sc-=3;if(sc>bs){bs=sc;best=u.id}});return best}
function pick5(u){const t=today();const rank=id=>{const c=S.cards[id];if(!c)return 1000;if(c.d<=t)return c.b;return 2000+c.d};
  return shuffle(shuffle(BYUNIT[u]).sort((a,b)=>rank(a)-rank(b)).slice(0,5))}
function pickWords(){const t=today();const rank=id=>{const c=S.cards[id];if(!c)return 1000+ITEM[id].idx;if(c.d<=t)return c.b;return 5000+c.d};
  return shuffle(BYUNIT.word.slice().sort((a,b)=>rank(a)-rank(b)).slice(0,10))}
function wordOpts(id){const q=ITEM[id];let pool=BYUNIT.word.map(x=>ITEM[x]).filter(x=>x.ja!==q.ja&&x.w!==q.w);const same=pool.filter(x=>x.pos===q.pos);if(same.length>=3)pool=same;
  const out=[q.ja];shuffle(pool).some(x=>{if(!out.includes(x.ja))out.push(x.ja);return out.length===4});return out}
function pickSet(u){const t=today();const rank=s=>{let r=0,un=0,mind=1e9;s.qs.forEach(q=>{const c=S.cards[q.id];if(!c)un++;else{if(c.d<=t&&c.b===0)r-=10;mind=Math.min(mind,c.d)}});if(r<0)return r;if(un)return 0;return mind};
  return shuffle(SETBY[u]).sort((a,b)=>rank(a)-rank(b))[0]}

/* ===================== セッション ===================== */
function start(u){rollover();const unit=UNIT[u];let set=null,ids;
  if(u==='word'){if(S.day.w>=WSETS)return;ids=pickWords()}
  else{if(locked())return;if(unit.part===5)ids=pick5(u);else{set=pickSet(u);ids=set.qs.map(q=>q.id)}}
  sess={u,set,i:0,items:ids.map(id=>({id,opts:u==='word'?wordOpts(id):ITEM[id].o,order:shuffle([0,1,2,3]),pick:null,ok:null,ms:0})),t0:Date.now()};done=null;render();window.scrollTo(0,0)}
function answer(k){const it=sess.items[sess.i];if(it.pick!=null)return;const t=today();
  it.pick=k;it.ok=it.order[k]===0;it.ms=Date.now()-sess.t0;
  const c=S.cards[it.id]||{b:0,d:t,n:0,w:0};c.n++;
  if(it.ok){c.b=Math.min(c.b+1,5);c.d=t+IV[c.b]}else{c.b=0;c.d=t;c.w++}
  S.cards[it.id]=c;S.day.total++;if(it.ok)S.day.correct++;save();render();
  const fb=document.getElementById('fb');if(fb&&fb.scrollIntoView)fb.scrollIntoView({block:'nearest',behavior:'smooth'})}
function next(){if(sess.i<sess.items.length-1){sess.i++;sess.t0=Date.now();render();if(!sess.set)window.scrollTo(0,0);else{const s=document.getElementById('qtop');if(s)s.scrollIntoView({block:'start'})}}else finish()}
function finish(){const n=sess.items.length,ok=sess.items.filter(x=>x.ok).length;const before=level().lv;
  const isW=sess.u==='word';let xp=isW?ok*3+10:ok*10+20;const bonus=Math.random()<0.2;if(bonus)xp*=2;let dayBonus=0,streakUp=false,freeze=false;
  if(isW)S.day.w++;else{S.day.done++;S.lastUnit=sess.u}
  if(!isW&&S.day.done>=S.quota&&S.lastDone!==S.day.key){S.streak++;S.lastDone=S.day.key;S.best=Math.max(S.best,S.streak);dayBonus=50;streakUp=true;
    if(S.streak%7===0&&S.freezes<2){S.freezes++;freeze=true}}
  S.xp+=xp+dayBonus;S.hist[S.day.key]={s:S.day.done,q:S.quota,c:S.day.correct,t:S.day.total};
  const keys=Object.keys(S.hist).map(Number).sort((a,b)=>a-b);while(keys.length>120)delete S.hist[keys.shift()];
  done={u:sess.u,w:isW,n,ok,xp,bonus,dayBonus,streakUp,freeze,lvUp:level().lv>before};sess=null;save();render();window.scrollTo(0,0)}

/* ===================== 描画 ===================== */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const blank=s=>esc(s).replace(/-{5,}/g,'<span class="blank">-------</span>');
function dlabel(k){const d=new Date(k*DAY);return (d.getUTCMonth()+1)+'/'+d.getUTCDate()+'（'+'日月火水木金土'[d.getUTCDay()]+'）'}
function est(u){const p=UNIT[u].part;return p===5?'5問・2分':p===6?'1文書4問・2分':u==='p7d'?'2文書4問・5分':'1文書3〜4問・3分'}

function slots(){return `<div class="slots">${Array.from({length:S.quota},(_,i)=>`<i>${i<S.day.done?`<span class="hanko${done&&!done.w&&i===S.day.done-1?' pop':''}">済</span>`:''}</i>`).join('')}</div>`}
function vHome(){const L=level(),dt=daysToTest(),lk=locked();let h='';
  h+=`<div class="head"><div><h1>リーディング道場</h1><p class="sub">${dlabel(S.day.key)}${dt!=null&&dt>=0?(dt===0?'　今日が本番':`　本番まであと${dt}日`):''}</p></div><div class="rank">${L.title}<br><span class="lab">Lv.${L.lv}</span></div></div>`;
  if(done)h+=vDone();
  if(!S.setup){h+=`<div class="sec"><h2>いつやるか、先に決める</h2><p class="sub">毎日かならずやっていることの直後がおすすめです。</p><div class="chips">${TRIGGERS.map((t,i)=>`<button class="chip${S.trigger===t?' on':''}" data-act="trig" data-v="${i}">${t}</button>`).join('')}</div><div><button class="btn" data-act="setupdone"${S.trigger?'':' disabled'}>決定</button></div></div>`}
  h+=`<div class="sec"><div class="row between"><span class="lab">今日の分</span><span class="sub">連続 <b class="num">${S.streak}</b> 日</span></div>${slots()}`;
  if(!lk){const u=recommend(),un=UNIT[u],st=ustat(u);
    h+=`<div style="margin-top:8px"><p class="lab">${S.day.done+1}本目</p><h2>${uname(un)}</h2><p class="sub">${est(u)}${st.due?`　<span class="red">復習${st.due}問</span>`:''}</p></div>
    <button class="btn pri" data-act="start" data-v="${u}">始める</button>
    ${S.trigger?`<p class="sub">${esc(S.trigger)}、1本。</p>`:''}`}
  else{h+=`<div class="row" style="margin-top:8px"><span class="hanko big${done&&done.streakUp?' pop':''}">済</span><div><h2>今日はここまで</h2><p class="sub">ゲーム解禁。続きは明日の朝4時から。</p></div></div>`}
  h+=`</div>`;
  const ws=ustat('word'),wl=S.day.w>=WSETS;
  h+=`<div class="sec line"><div class="row between"><div class="grow"><h2>単語</h2><p class="sub">10語ずつ・今日 <span class="num">${S.day.w}/${WSETS}</span>${ws.due?`　<span class="red">復習${ws.due}語</span>`:''}</p></div>
    <button class="btn" data-act="start" data-v="word"${wl?' disabled':''}>${wl?'済み':'始める'}</button></div></div>`;
  if(S.kinOn){const a=S.kin.pos,b=Math.min(a+S.kin.pace-1,1000);
    h+=`<div class="sec line"><div class="row between"><div class="grow"><h2>金フレ</h2><p class="sub">No.<span class="num">${a}–${b}</span>　本でやったら押す</p></div>
    <button class="btn" data-act="kin"${S.day.kin?' disabled':''}>${S.day.kin?'済み':'やった'}</button></div></div>`}
  /* 出席カード：今週を最後の行にした4週間 */
  const dw=new Date(S.day.key*DAY).getUTCDay(),end=S.day.key+(6-dw),start=end-27;
  h+=`<div class="sec line"><div class="row between"><h2>出席カード</h2><span class="sub">お守り <b class="num">${S.freezes}</b></span></div><div class="card7">${'日月火水木金土'.split('').map(d=>`<div class="hd">${d}</div>`).join('')}${Array.from({length:28},(_,i)=>{const k=start+i,r=k===S.day.key?{s:S.day.done,q:S.quota}:S.hist[k];const dd=new Date(k*DAY).getUTCDate();
    return `<div class="${k===S.day.key?'today':''}"><em>${dd}</em>${k>S.day.key?'':r&&r.s>=r.q?'<span class="hanko sm">済</span>':r&&r.s?`<span class="part num">${r.s}/${r.q}</span>`:''}</div>`}).join('')}</div>
    <p class="sub">お守りは、休んだ1日を埋めて連続を守ります。7日続けるごとに1つ。</p></div>`;
  return h}
function vDone(){const d=done,un=UNIT[d.u];const xs=[`+${d.xp+d.dayBonus} XP`];if(d.bonus)xs.push('2倍の当たり');if(d.lvUp)xs.push(`${level().title}に昇格`);if(d.freeze)xs.push('お守り +1');
  return `<div class="sec"><p class="lab">${uname(un)}</p><p class="score">${d.ok}<small> / ${d.n}</small></p><p class="sub">${xs.join('　')}</p>${d.ok<d.n?`<p class="sub">まちがえた${d.u==='word'?'語':'問題'}は次の回にまた出ます。</p>`:''}</div>`}

function vUnits(){const lk=locked();let h=`<div class="head"><h1>ユニット</h1></div>`;
  [5,6,7].forEach(p=>{h+=`<div class="sec"><p class="lab">PART ${p}</p><div>`;UNITS.filter(u=>u.part===p).forEach(u=>{const s=ustat(u.id);
    h+=`<div class="unit"><div class="row between"><h2>${u.name}</h2><span class="sub num">${s.m}/${s.total}${s.due?`　<span class="red">復習${s.due}</span>`:''}</span></div>
    <div class="bar"><i style="width:${Math.round(s.m/s.total*100)}%"></i></div>
    <div class="row between"><button class="link" data-act="tips" data-v="${u.id}">${openTips[u.id]?'要点を閉じる':'要点'}</button><button class="btn" data-act="start" data-v="${u.id}"${lk?' disabled':''}>解く</button></div>
    ${openTips[u.id]?`<ul class="tips">${u.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</div>`});h+='</div></div>'});
  const wu=UNIT.word,ws=ustat('word'),wl=S.day.w>=WSETS;
  h+=`<div class="sec"><p class="lab">単語</p><div><div class="unit"><div class="row between"><h2>頻出${ws.total}語</h2><span class="sub num">${ws.m}/${ws.total}${ws.due?`　<span class="red">復習${ws.due}</span>`:''}</span></div>
    <div class="bar"><i style="width:${Math.round(ws.m/ws.total*100)}%"></i></div>
    <div class="row between"><button class="link" data-act="tips" data-v="word">${openTips.word?'要点を閉じる':'要点'}</button><button class="btn" data-act="start" data-v="word"${wl?' disabled':''}>10語</button></div>
    ${openTips.word?`<ul class="tips">${wu.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</div></div>
    <p class="sub">語の選定と順番：TOEIC Service List 1.2（Browne &amp; Culligan、CC BY-SA 4.0）。訳と例文は自作。</p></div>`;
  h+=`<p class="sub">${lk?'今日の分は終わっています。要点はいつでも読めます。':`ここから解いても、今日の${S.quota}本に数えます。`}</p>`;
  return h}

function vRecord(){const L=level();let tot=0,w=0;Object.values(S.cards).forEach(c=>{tot+=c.n;w+=c.w});
  let h=`<div class="head"><h1>記録</h1><div class="rank">${L.title}<br><span class="lab">Lv.${L.lv}</span></div></div>`;
  h+=`<div class="sec"><div class="figs"><div><span class="lab">最長連続</span><b>${S.best}<small> 日</small></b></div><div><span class="lab">解いた数</span><b>${tot}<small> 問</small></b></div><div><span class="lab">正答率</span><b>${tot?Math.round((tot-w)/tot*100):'–'}<small> %</small></b></div></div>
    <div><div class="row between"><span class="lab">次の段まで</span><span class="sub num">${L.cur} / ${L.need} XP</span></div><div class="bar" style="margin-top:6px"><i style="width:${Math.round(L.cur/L.need*100)}%"></i></div></div></div>`;
  h+=`<div class="sec line"><h2>ユニット別の正答率</h2>${UNITS.map(u=>{let n=0,ww=0;BYUNIT[u.id].forEach(id=>{const c=S.cards[id];if(c){n+=c.n;ww+=c.w}});const r=n?Math.round((n-ww)/n*100):0;return `<div><div class="row between"><span>${uname(u)}</span><span class="sub num">${n?r+'%':'—'}</span></div><div class="bar" style="margin-top:4px"><i style="width:${r}%"></i></div></div>`}).join('')}</div>`;
  h+=`<div class="sec line"><h2>なぜこの作りか</h2><ul class="why">
   <li>全部が問題形式。読み直すより、思い出すほうが残る。<small>Roediger &amp; Karpicke 2006</small></li>
   <li>正解した問題は1日後、3日後、7日後にまた出る。<small>Cepeda ほか 2006</small></li>
   <li>通知ではなく「〜したら1本」。先に決めた人のほうが実行する。<small>Gollwitzer &amp; Sheeran 2006</small></li>
   <li>ゲームは終わってから。楽しみを後ろに置くと続く。<small>Milkman ほか 2014</small></li>
   <li>1日休んでも習慣は崩れない。だからお守りがある。<small>Lally ほか 2010</small></li>
   <li>1日の上限は、上の5つほど研究の裏づけがない。始めるのを軽くするための工夫。</li></ul></div>`;
  return h}

function vSetup(){let h=`<div class="head"><h1>設定</h1></div>`;
  h+=`<div class="sec"><h2>きっかけ</h2><div class="chips">${TRIGGERS.map((t,i)=>`<button class="chip${S.trigger===t?' on':''}" data-act="trig" data-v="${i}">${t}</button>`).join('')}</div></div>`;
  h+=`<div class="sec line"><h2>1日の本数</h2><div class="chips">${[3,4,5,6,8].map(n=>`<button class="chip${(S.nextQuota||S.quota)===n?' on':''}" data-act="quota" data-v="${n}">${n}</button>`).join('')}</div><p class="sub">今日は${S.quota}本。変えても反映は明日からです。</p></div>`;
  h+=`<div class="sec line"><h2>試験日</h2><div><label for="testdate">次に受ける日</label><input id="testdate" type="date" value="${esc(S.testDate)}"></div></div>`;
  h+=`<div class="sec line"><h2>金フレの記録</h2><div class="chips"><button class="chip${S.kinOn?' on':''}" data-act="kinon" data-v="1">使う</button><button class="chip${S.kinOn?'':' on'}" data-act="kinon" data-v="0">使わない</button></div>${S.kinOn?`<div class="row wrap"><div><label for="kinpos">今日の開始番号</label><input id="kinpos" type="number" min="1" max="1000" value="${S.kin.pos}" style="width:110px"></div><div><label for="kinpace">1日の語数</label><select id="kinpace">${[30,50,100].map(n=>`<option${S.kin.pace===n?' selected':''}>${n}</option>`).join('')}</select></div></div>`:''}</div>`;
  h+=`<div class="sec line"><h2>データ</h2><p class="sub">${esc(syncState)}</p><div><button class="link" data-act="reset">${resetArm?'本当に消す（もう一度押す）':'記録をすべて消す'}</button></div></div>`;
  return h}

function vSess(){const it=sess.items[sess.i],q=ITEM[it.id],un=UNIT[sess.u],ans=it.pick!=null;let h='';
  h+=`<div class="shead"><button class="link" data-act="quit">やめる</button><span class="lab">${uname(un)}</span><div class="dots">${sess.items.map((x,i)=>`<i class="${x.ok===true?'ok':x.ok===false?'ng':i===sess.i?'cur':''}"></i>`).join('')}</div></div>`;
  if(sess.set){sess.set.docs.forEach(d=>{let t=esc(d.t);
    if(un.part===6)t=t.replace(/\[(\d)\]/g,(m,n)=>{n=+n;const x=sess.items[n-1];if(x.pick!=null)return `<span class="filled">${esc(ITEM[x.id].o[0])}</span>`;return `<span class="blank${n-1===sess.i?' cur':''}">(${n}) -------</span>`});
    h+=`<div class="doc"><span class="dh">${esc(d.h)}</span>${t}</div>`})}
  h+=`<div id="qtop"></div>`;
  if(!ans)h+=`<div class="timer" title="目安の時間"><i style="animation-duration:${un.per}s"></i></div>`;
  if(un.part===0)h+=`<p class="stem"><span class="w">${esc(q.w)}</span><span class="ex">${esc(q.ex)}</span></p>`;
  else if(un.part===5)h+=`<p class="stem">${blank(q.q)}</p>`;
  else if(un.part===6)h+=`<p class="stem jp">(${q.n}) に入るのは</p>`;
  else h+=`<p class="stem">${esc(q.q)}</p>`;
  const afx=ans&&un.part!==0&&afxOn(it.opts);
  h+=`<div class="opts">${it.order.map((oi,k)=>{let c='';if(ans){if(oi===0)c+=' right';if(k===it.pick)c+=oi===0?' picked':' picked wrong'}return `<button class="opt${c}" data-act="ans" data-v="${k}"${ans?' disabled':''}><span class="mark">${'ABCD'[k]}</span>${afx?afxHtml(it.opts[oi]):`<span${un.part===0?' class="ja"':''}>${esc(it.opts[oi])}</span>`}</button>`}).join('')}</div>`;
  if(ans){const sec=Math.round(it.ms/1000);h+=`<div id="fb" class="fb"><p class="res">${it.ok?'正解':'不正解'}<small>${sec}秒（目安${un.per}秒）</small></p>${un.part===0?`<p><b>${esc(q.ja)}</b>　<small class="k-${q.pos}">${PN[q.pos]}</small></p><p class="cex">${exHtml(q)}</p><p class="sub">${esc(q.exj)}</p><p class="leg"><span class="k-n">名詞</span><span class="k-v">動詞</span><span class="k-a">形容詞</span><span class="k-d">副詞</span></p>${famHtml(q)}`:`<p>${esc(q.ex)}</p>`}</div>
    <button class="btn pri" data-act="next">${sess.i<sess.items.length-1?'次へ':'結果'}</button>`}
  return h}

function render(){rollover();const app=document.getElementById('app'),tabs=document.getElementById('tabs');
  if(sess){app.className='insess';tabs.hidden=true;app.innerHTML=vSess();return}
  app.className='';tabs.hidden=false;
  app.innerHTML=view==='units'?vUnits():view==='record'?vRecord():view==='setup'?vSetup():vHome();
  tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===view))}

/* ===================== 操作 ===================== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;
  if(a!=='reset')resetArm=false;
  if(a==='tab'){view=v;done=null;render();window.scrollTo(0,0)}
  else if(a==='start')start(v);
  else if(a==='ans')answer(+v);
  else if(a==='next')next();
  else if(a==='quit'){sess=null;render()}
  else if(a==='tips'){openTips[v]=!openTips[v];render()}
  else if(a==='trig'){S.trigger=TRIGGERS[+v];save();render()}
  else if(a==='setupdone'){S.setup=true;save();render()}
  else if(a==='quota'){const n=+v;S.nextQuota=n===S.quota?null:n;save();render()}
  else if(a==='kinon'){S.kinOn=v==='1';save();render()}
  else if(a==='kin'){if(!S.day.kin){S.day.kin=true;S.xp+=15;save();render()}}
  else if(a==='reset'){if(resetArm){S=fresh();resetArm=false;save();view='home'}else resetArm=true;render()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='testdate'){S.testDate=t.value;save()}
  else if(t.id==='kinpos'){S.kin.pos=Math.max(1,Math.min(1000,parseInt(t.value,10)||1));save()}
  else if(t.id==='kinpace'){S.kin.pace=+t.value;save()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sess)render()});
loadLocal();rollover();render();initCloud();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
